<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Winosseur</title>
<meta name="description" content="Winey tells you what a bottle is worth, which one to open tonight and why.">
<link rel="canonical" href="https://winosseur.com/go">
<meta property="og:url" content="https://winosseur.com/go">
<style>
  :root{
    --bg:#0A0A0A; --panel:#141414; --card:#1A1A1A; --line:#2A2A2A;
    --cream:#E5E3D8; --muted:#A3A3A3; --dim:#999999; --burgundy:#8B1C31; --warm:#C9BEB0;
    --sans:system-ui,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.55}
  a{color:var(--warm)}
  a:hover{color:var(--cream)}
  .wrap{max-width:860px;margin:0 auto;padding:0 20px}
  header{padding:72px 0 40px;text-align:center}
  .mark{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:0 0 22px}
  .kicker{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:0 0 22px}
  h1{font-family:var(--sans);font-size:34px;line-height:1.25;margin:0 0 14px;font-weight:700}
  .sub{font-size:17px;color:var(--muted);margin:0 0 30px}
  .cta{display:inline-block;background:var(--burgundy);color:var(--cream);text-decoration:none;
    font-weight:700;font-size:16px;padding:14px 28px;border-radius:12px}
  .cta:hover{color:var(--cream);opacity:.9}
  .free{font-size:13px;color:var(--dim);margin:14px 0 0}
  .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px;padding:34px 0 10px}
  figure{margin:0}
  img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:14px;background:var(--card)}
  figcaption{font-family:var(--sans);font-size:14px;color:var(--muted);margin-top:10px;line-height:1.45}
  h2{font-family:var(--sans);font-size:24px;margin:56px 0 6px;font-weight:700}
  .lede{color:var(--muted);margin:0 0 20px;font-size:15px}
  .post{border-top:1px solid var(--line);padding:22px 0 6px}
  .post h3{font-family:var(--sans);font-size:15px;letter-spacing:1px;text-transform:uppercase;
    color:var(--dim);margin:0 0 14px;font-weight:700}
  .qa{margin:0 0 18px}
  .q{font-weight:700;margin:0 0 5px;font-size:16px}
  .a{margin:0;color:var(--muted);font-size:15px}
  .src{font-size:14px;color:var(--dim);margin:14px 0 0}
  footer{border-top:1px solid var(--line);margin-top:56px;padding:28px 0 64px;color:var(--dim);font-size:14px}
  footer p{margin:0 0 9px}

  .backlink{display:inline-block;font-size:14px;color:var(--dim);text-decoration:none;margin:0 0 18px}
  .postmeta{color:var(--dim);font-size:14px;margin:0 0 30px}
  article h2{font-family:var(--sans);font-size:22px;margin:38px 0 10px;font-weight:700}
  article p{margin:0 0 18px;font-size:17px;line-height:1.65}
  article ul{margin:0 0 18px;padding-left:20px;color:var(--cream)}
  article li{margin:0 0 8px;font-size:17px;line-height:1.6}
  .sources{border-top:1px solid var(--line);margin-top:44px;padding-top:20px}
  .sources h2{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
  .sources li{font-size:15px;color:var(--muted);margin:0 0 7px}
  .mirror{font-size:14px;color:var(--dim);margin:18px 0 0}
  .issues{list-style:none;margin:0;padding:0}
  .issues li{border-top:1px solid var(--line);padding:18px 0}
  .issues a{font-family:var(--sans);font-size:19px;text-decoration:none;font-weight:600}
  .issues .when{display:block;color:var(--dim);font-size:13px;margin:4px 0 0}
  .issues .blurb{color:var(--muted);font-size:15px;margin:7px 0 0}
  .creed{color:var(--warm)}
  .position{color:var(--warm);font-style:italic;margin:0 0 14px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0 0}
  .topbar .home{font-family:var(--sans);font-weight:700;font-size:14px;letter-spacing:3px;text-transform:uppercase;
    color:var(--muted);text-decoration:none}
  .cta.small{font-size:14px;padding:10px 18px;border-radius:10px}
  .topbar .links{display:flex;align-items:center;gap:18px}
  .topbar .nav{font-size:14px;color:var(--muted);text-decoration:none}
  .worth{font-family:var(--sans);font-size:44px;font-weight:700;margin:0 0 6px;color:var(--cream)}
  .verdicts{list-style:none;margin:0;padding:0}
  .verdicts li{border-top:1px solid var(--line);padding:14px 0;font-size:17px;font-family:var(--sans);font-weight:600}
  .verdicts li:first-child{border-top:0;padding-top:4px}
  .wines{list-style:none;margin:0;padding:0}
  .wines li{border-top:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;gap:16px}
  .wines a{font-family:var(--sans);font-size:18px;text-decoration:none;font-weight:600}
  .wines .n{color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="mark">Winosseur</p>
    <h1>Winey tells you what a bottle is worth, which one to open tonight and why.</h1>
    <p class="position">Nobody pays Winey to like the wine.</p>
    <a class="cta" href="https://apps.apple.com/app/apple-store/id6759776756?pt=128599602&amp;ct=meta-oct&amp;mt=8">Get Winosseur on the App Store</a>
  </header>
  <figure style="max-width:360px;margin:0 auto">
    <img src="https://winosseur.com/shots/go-verdict.png" alt="Not a crowd score. Not a market average. Winey’s read of a shop shelf: the best pinot noir for the money, then each bottle with what it is worth." width="1290" height="2796">
  </figure>
  <footer>
    <p class="creed">Winey is paid only by the people who drink the wine, never by the people who sell it.</p>
    <p>
      <a href="https://winosseur.com/about.html">About</a> &middot;
      <a href="https://winosseur-privacy.carrd.co">Privacy</a> &middot;
      <a href="https://winosseur-support.carrd.co">Terms</a>
    </p>
  </footer>
</div>
</body>
</html>
